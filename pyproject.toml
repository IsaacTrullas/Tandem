[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem-local"
version = "0.5.0"
description = "Archivo local verificable de exportaciones personales de Tandem Source"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyJWT[crypto]>=2.8,<3", "pypdf>=5", "pdfplumber>=0.11", "Pillow>=10", "PyMuPDF>=1.24", "numpy>=2,<2.3", "opencv-python-headless==4.12.0.88"]

[project.optional-dependencies]
ocr = ["winocr==0.0.15; sys_platform == 'win32'"]
analysis = ["matplotlib>=3.9"]

[project.scripts]
tandem-local = "tandem.cli:main"

[tool.setuptools.package-data]
tandem = ["schema.sql", "api_schema.sql", "event_codes.json"]

[tool.setuptools.packages.find]
include = ["tandem*"]
